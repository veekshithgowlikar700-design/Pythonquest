name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: PyQuest_Android_Project
      - uses: actions/upload-artifact@v4
        with:
          name: PyQuest-APK
          path: PyQuest_Android_Project/app/build/outputs/apk/debug/app-debug.apk
